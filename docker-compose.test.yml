name: data-guardian-tests

services:
  data-guardian-test-db:
    image: mysql:8.4

    environment:
      MYSQL_ROOT_PASSWORD: test_root_password
      MYSQL_DATABASE: phase_2_data_guardian_test
      MYSQL_USER: data_guardian_test
      MYSQL_PASSWORD: test_password

    ports:
      - "127.0.0.1:3308:3306"

    tmpfs:
      - /var/lib/mysql

    healthcheck:
      test: >-
        mysql --host=127.0.0.1
        --user="$$MYSQL_USER"
        --password="$$MYSQL_PASSWORD"
        --database="$$MYSQL_DATABASE"
        --execute='SELECT 1;'
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s