spring.application.name=phase-2-data-guardian

# Database
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:phase_2_data_guardian}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# Security
security.jwt.secret=${JWT_SECRET:ZGV2ZWxvcG1lbnQtb25seS1zZWNyZXQtY2hhbmdlLW1lLTEyMzQ1Ng==}
security.jwt.issuer=${JWT_ISSUER:phase-2-data-guardian}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
security.token.type=Bearer
