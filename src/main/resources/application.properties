spring.application.name=phase-2-data-guardian

# Load local variables when starting Java from the project root. Docker supplies environment variables.
spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:phase_2_data_guardian}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:data_guardian}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# Security
security.jwt.secret=${JWT_SECRET:ZGV2ZWxvcG1lbnQtb25seS1zZWNyZXQtY2hhbmdlLW1lLTEyMzQ1Ng==}
security.jwt.issuer=${JWT_ISSUER:phase-2-data-guardian}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
security.token.type=Bearer

# OpenAPI / Swagger UI
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=false
springdoc.override-with-generic-response=false